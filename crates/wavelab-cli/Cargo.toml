[package]
name = "wavelab-cli"
version = "0.1.0"
description = "Command line for wavelab: probe, judge, null"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "wavelab"
path = "src/main.rs"

[dependencies]
wavelab = { path = "../wavelab" }
clap = { version = "4.5", features = ["derive"] }
